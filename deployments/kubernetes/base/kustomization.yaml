apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: point-of-sale

resources:
- apigateway/
- auth/
- category/
- clickhouse/
- common/
- cashier/
- db-migration/
- email/
- kafka/
- merchant/
- mongodb/
- nginx/
- observability/
- order/
- order_item/
- product/
- redis/
- role/
- stats_reader/
- stats_writer/
- stats-backfill/
- transaction/
- user/

patches:
- path: image-pull-secret-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: "^(apigateway|auth|cashier|category|email|merchant|order|order-item|product|role|stats-reader|stats-writer|transaction|user)$"
- path: job-image-pull-secret-patch.yaml
  target:
    group: batch
    version: v1
    kind: Job
    name: "^(migrate|stats-backfill)$"
