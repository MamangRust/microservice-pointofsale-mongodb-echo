apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: point-of-sale
spec:
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Satu database = satu MongoDB: tunggu kelima instance siap sebelum
      # menjalankan migrasi (pola sama seperti stats-backfill).
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for the five MongoDB instances..."
              until nc -z mongodb-identity.point-of-sale.svc.cluster.local 27017 \
                && nc -z mongodb-catalog.point-of-sale.svc.cluster.local 27017 \
                && nc -z mongodb-sales.point-of-sale.svc.cluster.local 27017 \
                && nc -z mongodb-merchant.point-of-sale.svc.cluster.local 27017 \
                && nc -z mongodb-email.point-of-sale.svc.cluster.local 27017; do
                echo "MongoDB not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] All MongoDB instances are ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: migrate
          image: ghcr.io/__GHCR_OWNER__/vertx-point-of-sale/db-migration:latest
          workingDir: /app
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          imagePullPolicy: IfNotPresent
      restartPolicy: OnFailure
